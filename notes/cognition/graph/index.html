<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cognition root co-occurrence graph (14 roots)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 0;
    background: #fafaf7;
    color: #222;
  }
  .header {
    padding: 16px 24px;
    background: white;
    border-bottom: 1px solid #e5e5e0;
  }
  .header h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
  .header p { margin: 0; font-size: 13px; color: #666; }
  .controls {
    padding: 12px 24px;
    background: #fff;
    border-bottom: 1px solid #e5e5e0;
    font-size: 13px;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls label { display: flex; gap: 8px; align-items: center; }
  #graph { width: 100vw; height: calc(100vh - 110px); }
  .node text {
    font-family: "SF Arabic", "Geeza Pro", "Noto Naskh Arabic", "Amiri", system-ui, serif;
    font-size: 16px;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .node .gloss {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 9px;
    fill: #333;
    text-anchor: middle;
  }
  .link { stroke-opacity: 0.4; }
  .link:hover { stroke-opacity: 1; }
  .tooltip {
    position: absolute;
    background: rgba(20,20,20,0.95);
    color: white;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    pointer-events: none;
    line-height: 1.5;
    max-width: 260px;
    z-index: 1000;
  }
  .tooltip .arabic {
    font-family: "SF Arabic", "Geeza Pro", "Noto Naskh Arabic", "Amiri", serif;
    font-size: 18px;
  }
  .legend {
    position: absolute;
    top: 130px;
    right: 24px;
    background: rgba(255,255,255,0.95);
    border: 1px solid #e5e5e0;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 12px;
    z-index: 100;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 3px 0;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="header">
  <h1>Cognition root co-occurrence graph (14 roots)</h1>
  <p>Nodes: cognitive roots (sized by Quran-wide occurrence). Edges: ayahs in which both roots appear (thickness = co-occurrence count). Clusters: detected via weighted label propagation. Drag nodes; hover for details.</p>
</div>
<div class="controls">
  <label>Edge weight threshold:
    <input type="range" id="edgeThreshold" min="1" max="50" value="1" />
    <span id="edgeThresholdVal">1</span>
  </label>
  <label>Show labels:
    <input type="checkbox" id="showLabels" checked />
  </label>
  <label>Charge strength:
    <input type="range" id="chargeStrength" min="-1500" max="-50" value="-400" />
  </label>
  <button id="resetZoom">Reset view</button>
</div>
<div id="graph"></div>
<div id="legend" class="legend"></div>

<script>
const data = {"nodes": [{"id": "*kr", "arabic": "ذكر", "english": "remember", "count": 292, "cluster": 0}, {"id": "Elm", "arabic": "علم", "english": "knowledge", "count": 854, "cluster": 1}, {"id": "Eql", "arabic": "عقل", "english": "reason", "count": 49, "cluster": 0}, {"id": "Hkm", "arabic": "حكم", "english": "wisdom/judge", "count": 210, "cluster": 1}, {"id": "bSr", "arabic": "بصر", "english": "sight/insight", "count": 148, "cluster": 0}, {"id": "bgy", "arabic": "بغي", "english": "seek/transgress", "count": 96, "cluster": 1}, {"id": "dbr", "arabic": "دبر", "english": "ponder", "count": 44, "cluster": 0}, {"id": "fkr", "arabic": "فكر", "english": "reflect", "count": 18, "cluster": 0}, {"id": "fqh", "arabic": "فقه", "english": "comprehend", "count": 20, "cluster": 0}, {"id": "lbb", "arabic": "لبب", "english": "kernel-of-heart", "count": 16, "cluster": 0}, {"id": "nZr", "arabic": "نظر", "english": "observe", "count": 129, "cluster": 0}, {"id": "qrA", "arabic": "قرا", "english": "read/recite", "count": 88, "cluster": 0}, {"id": "sAl", "arabic": "سال", "english": "ask", "count": 129, "cluster": 0}, {"id": "wjd", "arabic": "وجد", "english": "find/encounter", "count": 107, "cluster": 0}], "edges": [{"source": "Elm", "target": "Hkm", "weight": 71}, {"source": "*kr", "target": "Elm", "weight": 44}, {"source": "Elm", "target": "sAl", "weight": 27}, {"source": "Elm", "target": "bgy", "weight": 17}, {"source": "Elm", "target": "bSr", "weight": 13}, {"source": "Elm", "target": "wjd", "weight": 11}, {"source": "*kr", "target": "bSr", "weight": 11}, {"source": "*kr", "target": "qrA", "weight": 11}, {"source": "*kr", "target": "lbb", "weight": 10}, {"source": "*kr", "target": "Hkm", "weight": 9}, {"source": "Elm", "target": "qrA", "weight": 9}, {"source": "*kr", "target": "sAl", "weight": 8}, {"source": "*kr", "target": "bgy", "weight": 7}, {"source": "Hkm", "target": "bgy", "weight": 7}, {"source": "Elm", "target": "lbb", "weight": 5}, {"source": "Elm", "target": "nZr", "weight": 5}, {"source": "bSr", "target": "nZr", "weight": 4}, {"source": "bgy", "target": "wjd", "weight": 4}, {"source": "*kr", "target": "nZr", "weight": 4}, {"source": "Elm", "target": "Eql", "weight": 3}, {"source": "Hkm", "target": "qrA", "weight": 3}, {"source": "bSr", "target": "bgy", "weight": 3}, {"source": "dbr", "target": "qrA", "weight": 3}, {"source": "*kr", "target": "dbr", "weight": 3}, {"source": "bSr", "target": "wjd", "weight": 2}, {"source": "Hkm", "target": "sAl", "weight": 2}, {"source": "Hkm", "target": "lbb", "weight": 2}, {"source": "*kr", "target": "fkr", "weight": 2}, {"source": "Hkm", "target": "bSr", "weight": 2}, {"source": "Hkm", "target": "wjd", "weight": 2}, {"source": "dbr", "target": "wjd", "weight": 2}, {"source": "qrA", "target": "wjd", "weight": 2}, {"source": "qrA", "target": "sAl", "weight": 2}, {"source": "fqh", "target": "nZr", "weight": 2}, {"source": "Eql", "target": "sAl", "weight": 2}, {"source": "Eql", "target": "qrA", "weight": 2}, {"source": "*kr", "target": "fqh", "weight": 2}, {"source": "nZr", "target": "sAl", "weight": 2}, {"source": "nZr", "target": "wjd", "weight": 2}, {"source": "bgy", "target": "qrA", "weight": 2}, {"source": "fkr", "target": "sAl", "weight": 1}, {"source": "bgy", "target": "lbb", "weight": 1}, {"source": "Elm", "target": "dbr", "weight": 1}, {"source": "Elm", "target": "fkr", "weight": 1}, {"source": "bSr", "target": "fkr", "weight": 1}, {"source": "bgy", "target": "nZr", "weight": 1}, {"source": "bSr", "target": "fqh", "weight": 1}, {"source": "bSr", "target": "dbr", "weight": 1}, {"source": "Eql", "target": "nZr", "weight": 1}, {"source": "bSr", "target": "sAl", "weight": 1}, {"source": "dbr", "target": "fqh", "weight": 1}, {"source": "fqh", "target": "qrA", "weight": 1}, {"source": "fqh", "target": "wjd", "weight": 1}, {"source": "*kr", "target": "Eql", "weight": 1}, {"source": "Eql", "target": "bSr", "weight": 1}, {"source": "dbr", "target": "sAl", "weight": 1}, {"source": "bgy", "target": "sAl", "weight": 1}, {"source": "dbr", "target": "lbb", "weight": 1}, {"source": "Hkm", "target": "nZr", "weight": 1}, {"source": "fkr", "target": "qrA", "weight": 1}], "n_clusters": 2};

const width = window.innerWidth;
const height = window.innerHeight - 110;

// Color scale for clusters
const clusterColors = [
  "#4a90e2", "#e74c3c", "#27ae60", "#f39c12", "#8e44ad",
  "#16a085", "#d35400", "#7f8c8d", "#c0392b", "#2c3e50",
];
function color(cluster) { return clusterColors[cluster % clusterColors.length]; }

// Node radius from count (log scale)
function radius(count) {
  return 6 + Math.log(Math.max(count, 1)) * 4;
}

const svg = d3.select("#graph").append("svg")
  .attr("width", width).attr("height", height);

const g = svg.append("g");

// Zoom
const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);
d3.select("#resetZoom").on("click", () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity));

// Tooltip
const tooltip = d3.select("body").append("div").attr("class", "tooltip").style("display", "none");

const link = g.append("g").attr("stroke", "#666").selectAll("line").data(data.edges).join("line")
  .attr("class", "link")
  .attr("stroke-width", d => Math.sqrt(d.weight) * 0.7);

const node = g.append("g").selectAll("g").data(data.nodes).join("g").attr("class", "node");

node.append("circle")
  .attr("r", d => radius(d.count))
  .attr("fill", d => color(d.cluster))
  .attr("stroke", "white").attr("stroke-width", 1.5)
  .on("mouseover", (e, d) => {
    const adj = data.edges.filter(x => x.source.id === d.id || x.target.id === d.id || x.source === d.id || x.target === d.id);
    const top = adj.map(e => {
      const other = (e.source.id === d.id || e.source === d.id) ? (e.target.id || e.target) : (e.source.id || e.source);
      return {root: other, weight: e.weight};
    }).sort((a,b) => b.weight - a.weight).slice(0, 5);
    const arabicMap = Object.fromEntries(data.nodes.map(n => [n.id, n.arabic]));
    const html = `
      <div class="arabic">${d.arabic}</div>
      <b>${d.id}</b> ${d.english ? "— " + d.english : ""}<br>
      Quran-wide occurrences: ${d.count}<br>
      Cluster: ${d.cluster + 1}<br>
      <hr style="border-color: #555; margin: 6px 0;">
      <b>Top co-occurring (in this graph):</b><br>
      ${top.map(t => `${arabicMap[t.root]} (${t.root}): ${t.weight} ayahs`).join("<br>")}
    `;
    tooltip.style("display", "block").html(html);
  })
  .on("mousemove", (e) => tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY + 14) + "px"))
  .on("mouseout", () => tooltip.style("display", "none"))
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
  );

const labelArabic = node.append("text").text(d => d.arabic);
const labelEng = node.append("text").attr("class", "gloss").attr("dy", d => radius(d.count) + 12).text(d => d.english);

const sim = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.edges).id(d => d.id).distance(d => 100 / Math.sqrt(d.weight)).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => radius(d.count) + 18))
  .on("tick", () => {
    link
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

// Controls
d3.select("#edgeThreshold").on("input", function() {
  const t = +this.value;
  d3.select("#edgeThresholdVal").text(t);
  link.style("display", d => d.weight >= t ? null : "none");
});
d3.select("#showLabels").on("change", function() {
  const show = this.checked;
  labelArabic.style("display", show ? null : "none");
  labelEng.style("display", show ? null : "none");
});
d3.select("#chargeStrength").on("input", function() {
  sim.force("charge").strength(+this.value);
  sim.alpha(0.5).restart();
});

// Legend
const clusters = [...new Set(data.nodes.map(n => n.cluster))].sort();
const legend = d3.select("#legend");
legend.append("div").style("font-weight", "600").style("margin-bottom", "6px").text(`${clusters.length} clusters detected`);
clusters.forEach(c => {
  const members = data.nodes.filter(n => n.cluster === c);
  const item = legend.append("div").attr("class", "legend-item");
  item.append("div").attr("class", "legend-dot").style("background", color(c));
  item.append("span").text(`Cluster ${c + 1} (${members.length}): ` + members.map(m => m.arabic).join(" · "));
});
</script>
</body>
</html>
